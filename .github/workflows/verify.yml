name: Credential research

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: credential-research-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [spec-package, model, security, research, controls, placement]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Locate standalone or notes module
        id: module
        shell: bash
        run: |
          if [[ -f ci/experiments.json ]]; then
            module=.
          else
            module=research/envoy-composition/spikes/upstream-credential
          fi
          test -f "$module/ci/experiments.json"
          echo "path=$module" >> "$GITHUB_OUTPUT"
          source "$module/ci/versions.env"
          echo "go=$GO_VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ steps.module.outputs.go }}
          cache: false
      - name: Install pinned Envoy binary
        if: matrix.lane == 'placement'
        working-directory: ${{ steps.module.outputs.path }}
        run: ./ci/install-envoy.sh
      - name: Verify experiment lane
        working-directory: ${{ steps.module.outputs.path }}
        env:
          LANE: ${{ matrix.lane }}
          GOTOOLCHAIN: local
        run: ./ci/run.sh "$LANE"
      - name: Publish check summary
        if: always() && steps.module.outputs.path != ''
        working-directory: ${{ steps.module.outputs.path }}
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [[ -f "evidence/$LANE-summary.txt" ]]; then
            cat "evidence/$LANE-summary.txt" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$LANE: NOT EXECUTED (setup failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.module.outputs.path != ''
        with:
          name: evidence-${{ matrix.lane }}-${{ github.sha }}
          path: ${{ steps.module.outputs.path }}/evidence/
          retention-days: 14
          if-no-files-found: warn
